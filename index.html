function skipTyping(){

    if(rainbowRunning) return;

    if(typingFinished) return;

    clearInterval(timer);

    const area =
        document.getElementById("typing");

    // 2차 편지 출력 중
    if(secretTyping){

        area.innerHTML =
            message.replace(/\n/g,"<br>")
            +
            secretMessage.replace(/\n/g,"<br>");

    }
    else{

        area.innerHTML =
            message.replace(/\n/g,"<br>");

    }

    typingFinished = true;

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior:"smooth"
    });

}


function touchHeart(e){

    e.stopPropagation();

    const target = e.currentTarget;

    target.innerHTML = "🌟";

    heartCount++;

    darkenBackground();

    setTimeout(()=>{
        target.remove();
    },500);

    if(heartCount >= 10 && !secretUnlocked){
       
        secretUnlocked = true;
        rainbowRunning = true;

        rainbowFlash();
         

        setTimeout(()=>{
            
            rainbowRunning = false;
            startSecretTyping();
        },2500);

    }

}

function rainbowFlash(){

    document.body.style.transition =
        "background-color .3s";

    const colors = [
        "#ff0000",
        "#ff8800",
        "#ffff00",
        "#00ff00",
        "#00ffff",
        "#0000ff",
        "#ff00ff"
    ];

    let i = 0;

    const rainbow = setInterval(()=>{

        document.body.style.backgroundColor =
            colors[i % colors.length];

        i++;

    },150);

    setTimeout(()=>{

        clearInterval(rainbow);

        document.body.style.backgroundColor =
            originalBg;

    },2500);

    typingFinished = false

}

function startSecretTyping(){

     secretTyping = true;
    typingFinished = false;
    
    const area =
        document.getElementById("typing");

    let sidx = 0;

    timer = setInterval(()=>{

        area.innerHTML +=
            secretMessage.charAt(sidx)
                .replace(/\n/g,"<br>");

        sidx++;

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

        if(sidx >= secretMessage.length){

            clearInterval(timer);
            typingFinished = true;
            secretTyping = false;

        }

    },35);

}

}
