<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🍓 Strawberry Princess 🍓</title>

<style>

body{
    margin:0;
    background:#fff5f8;
    font-family:'Malgun Gothic',sans-serif;
    overflow-x:hidden;
}

#login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
    text-align:center;
}

input{
    padding:10px;
    width:220px;
    font-size:16px; /* 확대를 막기 위해 추가 */
}

button{
    padding:10px 20px;
    margin-top:10px;
    cursor:pointer;
    font-size:16px; /* 확대를 막기 위해 추가 */
}

#main{
    display:none;
}

.header{
    text-align:center;
    padding:50px 20px;
}

.slider{
    width:90%;
    max-width:600px;
    margin:auto;
}

.slider img{
    width:100%;
    border-radius:20px;
    display:none;
}

.slider img.active{
    display:block;
}

.letter{
    width:80%;
    max-width:800px;
    /*margin:50px auto;*/
    margin:50px auto 200px auto; /*내용 입력창 아래에 여백추가*/
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
    line-height:2;
    min-height:300px;
}

.petal{
    position:fixed;
    top:-20px;
    animation:fall linear infinite;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

</style>
</head>

<body>

    

<div id="login">

<div class="box">

<h2>🍓 0딸기꼰듀0 👸</h2>

<p>닥터스트레인지가 된 날 기억해?</p>

<input type="password" id="pw">

<br>

<button onclick="checkPw()">입장</button>

</div>

</div>


<div id="intro" style="display:none;">

    <div style="
        height:100vh;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        background:black;
    ">

        <video
            id="introVideo"
            width="100%"
            playsinline
            controls="false"
            autoplay>

            <source src="intro.mp4" type="video/mp4">

        </video>

        <button
            id="nextBtn"
            onclick="showLetter()"
            style="
                display:none;
                margin-top:20px;
                padding:12px 30px;
                font-size:18px;
            ">

            다음 💌

        </button>

    </div>

</div>
    

<div id="main">

<audio id="bgm" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="header">
    <h1>🍓 0딸기꼰듀0 👸</h1>
</div>

<div class="slider">

<img src="photo1.jpg" class="active">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">

</div>

<div class="letter">
    <div id="typing"></div>
</div>

</div>

<script>

const isIPhone =
/iPhone/i.test(navigator.userAgent);

if(!isIPhone){
document.title = "Wrong Approach"
document.body.innerHTML=`

<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#fff5f8;
font-family:sans-serif;
">

<div style="
background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.15);
">

<h1>🚫접근할 수 없습니다.🚫</h1>

<p>
잘못된 접근입니다.
</p>

</div>

</div>

`;

throw new Error("Desktop Blocked");
}
    
const PASSWORD="2";
let iFailCnt = 0;
    
function checkPw(){

    const pw=document.getElementById("pw").value;

    
    
    if(pw===PASSWORD){

        document.getElementById("login").style.display="none";
        document.getElementById("main").style.display="block";

        document.getElementById("bgm").play();

        document.getElementById("main")
        .addEventListener("touchstart", skipTyping);

        document.getElementById("main")
        .addEventListener("click", skipTyping);


        startTyping();
        startPetals();
    }
    else{
        iFailCnt++;
        if(iFailCnt == 1)
        {
            alert("다른날에도 종종 닥터 스트레인지가 되는구나..?");
        }
        else if(iFailCnt == 2)
        {
            alert("20260101 형식으로 써야해!");
        }
        else if(iFailCnt == 3)
        {
            alert("이정도면 진짜 모르는건데?");
        }
        else
        {
            alert("ㅎㅎ 내가알려줄게 나한테 물어봐");
        }
        
    }
}

const message=
`안녕하세요.

이 페이지를 열어주셔서 감사합니다.

처음 만났던 날부터 지금까지
많은 시간이 흘렀습니다.

좋은 순간도 있었고,
힘든 순간도 있었지만

함께했던 시간들은
항상 특별한 기억으로 남아있습니다.

앞으로도 지금처럼
웃는 일이 더 많았으면 좋겠습니다.

항상 고맙습니다.

- 이준 드림 -`;

let idx=0;

//터치로 타이핑 스킵을 위한 전역변수선언
let timer=null;
let typingFinished=false;

//숨겨진 메세지 이스터에그를 위한 전역변수 선언
let heartCount = 0;
let secretUnlocked = false;

const originalBg = "#fff5f8";

//이스터에그 메세지
const secretMessage = `

🍓

사실 아직 끝이 아니야.

이 편지를 여기까지 읽고
하트까지 찾아 눌렀다는 건

정말 꼼꼼하게 봤다는 거겠지?

그래서 준비한 숨겨진 메시지야.

항상 고맙고
앞으로도 잘 부탁해.

❤️`;

function startTyping(){

    const area=document.getElementById("typing");

    //터치로 타이핑 스킵을 위한 수정
    //const timer=setInterval(()=>{
    timer=setInterval(()=>{

        area.innerHTML+=message.charAt(idx)
                            .replace(/\n/g,"<br>");
        //자동스크롤 추가
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
                        });
    
        
        idx++;

        if(idx>=message.length){
            clearInterval(timer);
            typingFinished = true;
        }
    //},80);
    },65);//타이핑속도 빠르게
}

const slides=document.querySelectorAll(".slider img");

let current=0;

setInterval(()=>{

    slides[current].classList.remove("active");

    current++;

    if(current>=slides.length)
        current=0;

    slides[current].classList.add("active");

},3000);

function startPetals(){

    setInterval(()=>{

        const p=document.createElement("div");

        p.className="petal";

const items = [
    //"🍓","🍓","🍓","🍓",
    "🌷", "🌷",
    "🥭", "🥭",
    "❤️", "💞", "💖", "🩷", "💗", "💝", "💘"
];

p.innerHTML =
    items[Math.floor(Math.random() * items.length)];

        //하트 이모지 터치 이벤트 추가
        //if(p.innerHTML === "💖"){

            p.addEventListener("touchstart", touchHeart);
            p.addEventListener("click", touchHeart);
        
        //}

        p.style.left=Math.random()*100+"vw";

        //p.style.fontSize=(15+Math.random()*20)+"px";
        p.style.fontSize=(10+Math.random()*8)+"px"; //이모지사이즈작게
        p.style.animationDuration=
            (5+Math.random()*8)+"s";

        document.body.appendChild(p);

        setTimeout(()=>{
            p.remove();
        },15000);

    //},300);
    },500); //생성간격늘림
}

function skipTyping(){

    if(typingFinished) return;

    clearInterval(timer);

    //document.getElementById("typing").innerHTML =
        //message.replace(/\n/g,"<br>");
    let allText = message;

    if(secretUnlocked){
        allText += secretMessage;
    }
    
    document.getElementById("typing").innerHTML =
        allText.replace(/\n/g,"<br>");

    typingFinished = true;

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}



function touchHeart(e){

    e.stopPropagation();

    const target = e.currentTarget;

    target.innerHTML = "🌟";

    heartCount++;

    darkenBackground();

    setTimeout(()=>{
        target.remove();
    },500);

    if(heartCount >= 10 && !secretUnlocked){
       
        secretUnlocked = true;

        rainbowFlash();
         typingFinished = false

        setTimeout(()=>{
            startSecretTyping();
        },2500);

    }

}

function darkenBackground(){

    const max = 10;
    /*
    const ratio = Math.min(heartCount,max) / max;

    const r = Math.floor(255 - ratio * 30);
    const g = Math.floor(245 - ratio * 20);
    const b = Math.floor(248 - ratio * 20);

    
    document.body.style.backgroundColor =
        `rgb(${r},${g},${b})`;
    */

    if(heartCount == 1)
    {
        document.body.style.backgroundColor =
            `rgb(0, 122, 255)`;
    }
    else if(heartCount == 2)
    {
        document.body.style.backgroundColor =
            `rgb(0, 122, 255)`;
    }
    else if(heartCount == 3)
    {
        document.body.style.backgroundColor =
            `rgb(0, 0, 128)`;
    }
    else if(heartCount == 4)
    {
        document.body.style.backgroundColor =
            `rgb(0, 0, 128)`;
    }
    else if(heartCount == 5)
    {
        document.body.style.backgroundColor =
            `rgb(97, 191, 154)`;
    }
    else if(heartCount == 6)
    {
        document.body.style.backgroundColor =
            `rgb(97, 191, 154)`;
    }
    else if(heartCount == 7)
    {
        document.body.style.backgroundColor =
            `rgb(3, 23, 48)`;
    }
    else if(heartCount == 8)
    {
        document.body.style.backgroundColor =
            `rgb(3, 23, 48)`;
    }
    else if(heartCount == 9)
    {
        document.body.style.backgroundColor =
           `rgb(0, 106, 92)`;
    }
    else if(heartCount == 10)
    {
        document.body.style.backgroundColor =
            `rgb(0, 106, 92)`;
    }
    
        

}

function rainbowFlash(){

    document.body.style.transition =
        "background-color .3s";

    const colors = [
        "#ff0000",
        "#ff8800",
        "#ffff00",
        "#00ff00",
        "#00ffff",
        "#0000ff",
        "#ff00ff"
    ];

    let i = 0;

    const rainbow = setInterval(()=>{

        document.body.style.backgroundColor =
            colors[i % colors.length];

        i++;

    },150);

    setTimeout(()=>{

        clearInterval(rainbow);

        document.body.style.backgroundColor =
            originalBg;

    },2500);

}

function startSecretTyping(){

    const area =
        document.getElementById("typing");

    let sidx = 0;

    timer = setInterval(()=>{

        area.innerHTML +=
            secretMessage.charAt(sidx)
                .replace(/\n/g,"<br>");

        sidx++;

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

        if(sidx >= secretMessage.length){

            clearInterval(timer);

        }

    },35);

}

</script>
