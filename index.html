function rainbowFlash(){

    document.body.style.transition =
        "background-color .3s";

    const colors = [
        "#ff0000",
        "#ff8800",
        "#ffff00",
        "#00ff00",
        "#00ffff",
        "#0000ff",
        "#ff00ff"
    ];

    let i = 0;

    const rainbow = setInterval(()=>{

        document.body.style.backgroundColor =
            colors[i % colors.length];

        i++;

    },150);

    setTimeout(()=>{

        clearInterval(rainbow);

        document.body.style.backgroundColor =
            originalBg;

    },2500);

    typingFinished = false

}

function startSecretTyping(){

            clearInterval(timer);

        }

}

        .style.display = "none";
    
    document.getElementById("main")
        .style.display = "block";
    
    document.getElementById("bgm").play();
    
    document.getElementById("main")
        .addEventListener("touchstart", skipTyping);
    
    document.getElementById("main")
        .addEventListener("click", skipTyping);
    
    startTyping();
    startPetals();
}

</script>
