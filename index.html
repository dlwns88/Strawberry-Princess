<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🍓 Strawberry Princess 🍓</title>

<style>

body{
    margin:0;
    background:#fff5f8;
    font-family:'Malgun Gothic',sans-serif;
    overflow-x:hidden;
}

#login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
    text-align:center;
}

input{
    padding:10px;
    width:220px;
    font-size:16px; /* 확대를 막기 위해 추가 */
}

button{
    padding:10px 20px;
    margin-top:10px;
    cursor:pointer;
    font-size:16px; /* 확대를 막기 위해 추가 */
}

#main{
    display:none;
}

.header{
    text-align:center;
    padding:50px 20px;
}

.slider{
    width:90%;
    max-width:600px;
    margin:auto;
}

.slider img{
    width:100%;
    border-radius:20px;
    display:none;
}

.slider img.active{
    display:block;
}

.letter{
    width:90%;
    max-width:800px;
    /*margin:50px auto;*/
    margin:50px auto 200px auto; /*내용 입력창 아래에 여백추가*/
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
    line-height:2;
    min-height:300px;
}

.petal{
    position:fixed;
    top:-20px;
    animation:fall linear infinite;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

</style>
</head>

<body>

    

<div id="login">

<div class="box">

<h2>🍓 0딸기꼰듀0 👸</h2>

<p>닥터스트레인지가 된 날 기억해?</p>

<input type="password" id="pw">

<br>

<button onclick="checkPw()">입장</button>

</div>

</div>

<div id="main">

<audio id="bgm" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="header">
    <h1>💌 To. 딸기공주 💌</h1>
</div>

<div class="slider">

<!--<img src="photo1.jpg" class="active">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">-->

</div>

<div class="letter">
    <div id="typing"></div>
</div>

</div>

<script>

const isIPhone =
/iPhone/i.test(navigator.userAgent);

if(!isIPhone){
document.title = "Wrong Approach"
document.body.innerHTML=`

<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#fff5f8;
font-family:sans-serif;
">

<div style="
background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.15);
">

<h1>🚫접근할 수 없습니다.🚫</h1>

<p>
잘못된 접근입니다.
</p>

</div>

</div>

`;

throw new Error("Desktop Blocked");
}
    
const PASSWORD="1";
let iFailCnt = 0;
    
function checkPw(){

    const pw=document.getElementById("pw").value;

    
    
    if(pw===PASSWORD){

        document.getElementById("login").style.display="none";
        document.getElementById("main").style.display="block";

        document.getElementById("bgm").play();

        startTyping();
        startPetals();
    }
    else{
        iFailCnt++;
        if(iFailCnt == 1)
        {
            alert("다른날에도 종종 닥터 스트레인지가 되는구나..?");
        }
        else if(iFailCnt == 2)
        {
            alert("20260101 형식으로 써야해!");
        }
        else if(iFailCnt == 3)
        {
            alert("이정도면 진짜 모르는건데?");
        }
        else
        {
            alert("ㅎㅎ 내가알려줄게 나한테 물어봐");
        }
        
    }
}

const message=
`안녕하세요.

이 페이지를 열어주셔서 감사합니다.

처음 만났던 날부터 지금까지
많은 시간이 흘렀습니다.

좋은 순간도 있었고,
힘든 순간도 있었지만

함께했던 시간들은
항상 특별한 기억으로 남아있습니다.

앞으로도 지금처럼
웃는 일이 더 많았으면 좋겠습니다.

항상 고맙습니다.

- 이준 드림 -`;

let idx=0;

//터치로 타이핑 스킵을 위한 전역변수선언
let timer=null;
let typingFinished=false;

function startTyping(){

    const area=document.getElementById("typing");

    //터치로 타이핑 스킵을 위한 수정
    //const timer=setInterval(()=>{
    timer=setInterval(()=>{

        area.innerHTML+=message.charAt(idx)
                            .replace(/\n/g,"<br>");
        //자동스크롤 추가
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
                        });
    
        
        idx++;

        if(idx>=message.length){
            clearInterval(timer);
            typingFinished = true;
        }
    //},80);
    },35);//타이핑속도 빠르게
}

const slides=document.querySelectorAll(".slider img");

let current=0;

setInterval(()=>{

    slides[current].classList.remove("active");

    current++;

    if(current>=slides.length)
        current=0;

    slides[current].classList.add("active");

},3000);

function startPetals(){

    setInterval(()=>{

        const p=document.createElement("div");

        p.className="petal";

const items = [
    //"🍓","🍓","🍓","🍓",
    "🌷","🌷","🌷",
    "🥭","🥭",
    "💖"
];

p.innerHTML =
    items[Math.floor(Math.random() * items.length)];

        p.style.left=Math.random()*100+"vw";

        //p.style.fontSize=(15+Math.random()*20)+"px";
        p.style.fontSize=(10+Math.random()*8)+"px"; //이모지사이즈작게
        p.style.animationDuration=
            (5+Math.random()*8)+"s";

        document.body.appendChild(p);

        setTimeout(()=>{
            p.remove();
        },15000);

    //},300);
    },500); //생성간격늘림
}

function skipTyping(){

    if(typingFinished) return;

    clearInterval(timer);

    document.getElementById("typing").innerHTML =
        message.replace(/\n/g,"<br>");

    typingFinished = true;

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}

document.addEventListener("touchstart", skipTyping);
document.addEventListener("click", skipTyping);

</script>

</body>
</html>
